name: APK Derle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Gradlew calistirilabilir yap
        run: chmod +x ./gradlew

      - name: Surum kontrolu
        run: ./gradlew --version

      - name: Debug + Release APK derle
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: APK dosyalarini listele
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: APK'lari artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: LPG-Analiz-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Surum etiketi olustur
        run: echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release olustur ve APK yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: LPG Analiz ${{ env.TAG }}
          body: |
            Toyota Auris 2011 icin LPG tuketim ve maliyet analiz uygulamasi.

            Kurulum: asagidaki `app-release.apk` dosyasini telefona indirip acin.
            Android "bilinmeyen kaynaklardan yuklemeye izin ver" uyarisi cikarsa onaylayin.
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
